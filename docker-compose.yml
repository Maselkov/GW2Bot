services:
  bot:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file: .env
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
    volumes:
      - logs:/app/logs
      - ./fonts:/app/fonts:ro

  mongo:
    image: mongo:9
    # Don't log every connection; the healthcheck opens several each run
    command: ["--quiet"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      start_interval: 2s
      start_period: 30s
      timeout: 5s
      retries: 5

volumes:
  logs:
  mongo-data:
