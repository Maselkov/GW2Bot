version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The Dockerfile's python base image
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Dependabot can't run pip updates yet: it supports Python up to 3.14 and
  # pyproject.toml requires >=3.15. Enable this once it supports 3.15.
