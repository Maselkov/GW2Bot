name: Build image

# Runs the tests, then pushes ghcr.io/<owner>/gw2bot:<sha>. An image that
# was already built for this commit (e.g. on deploy/test) is reused, so prod
# gets the exact image that ran on test.
on:
  workflow_call:
    inputs:
      tags:
        description: Extra tags for the image, space-separated
        type: string
        default: ""
    outputs:
      image:
        value: ${{ jobs.build.outputs.image }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip install --no-deps -e .
      - run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase in image names
      - name: Image name
        id: name
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gw2bot"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing image
        id: existing
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.found != 'true'
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add tags
        if: inputs.tags != ''
        env:
          REPO: ${{ steps.name.outputs.repo }}
          IMAGE: ${{ steps.name.outputs.image }}
          EXTRA_TAGS: ${{ inputs.tags }}
        run: |
          read -ra tags <<< "$EXTRA_TAGS"
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$REPO:$tag"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE"
