name: Live GW2 API

# Checks that the GW2 API still returns the fields the bot reads.
# Authenticated tests use the GW2_API_KEY repository secret and are skipped
# when it isn't set.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v -m live
        env:
          GW2_API_KEY: ${{ secrets.GW2_API_KEY }}
