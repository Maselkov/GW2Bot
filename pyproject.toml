[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gw2bot"
version = "0.1.0"
description = "A Guild Wars 2 Discord bot"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.15"
dependencies = [
    "aiohttp",
    "beautifulsoup4",
    "discord.py>=2.7.1",
    # 4.13 is the first release with the async API generally available
    "pymongo>=4.13",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "time-machine",
]

[project.scripts]
gw2bot = "gw2bot.__main__:main"

[tool.setuptools.packages.find]
include = ["gw2bot*"]

[tool.setuptools.package-data]
"gw2bot.data" = ["*.json"]

[tool.ruff.lint]
# Mistakes rather than style: pyflakes (unused imports and variables,
# undefined names), statement and syntax errors, bugbear, pylint's errors,
# and asyncio tasks nobody keeps (use GW2Cog.run_in_background)
select = ["F", "E7", "E9", "W605", "B", "PLE", "RUF006"]
# `raise ... from` and zip(strict=) are style here, not bugs
ignore = ["B904", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = '-m "not live"'
markers = ["live: hits the real GW2 API (run with: pytest -m live)"]
filterwarnings = ["ignore::DeprecationWarning:discord.*"]
